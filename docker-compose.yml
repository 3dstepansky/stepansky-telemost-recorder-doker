services:
  recorder:
    build: .
    container_name: telemost-recorder
    volumes:
      - ./recordings:/app/recordings
      - /home/ubuntu/baza:/home/ubuntu/baza
    env_file:
      - .env
    # Для запуска через n8n или консоль:
    # docker-compose run --rm recorder "https://telemost.yandex.ru/j/..."
